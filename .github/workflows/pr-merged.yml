name: Handle Merged PR

on:
  pull_request:
    types:
      - closed

jobs:
  label-and-delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # Step 1: Add "merged" label to the PR
      - name: Add merged label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['Merged']
            });

      # Step 2: Delete the source branch
      - name: Delete branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.payload.pull_request.head.ref;
            // Don't delete protected branches
            const protectedBranches = ['main'];
            if (!protectedBranches.includes(branch)) {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
              console.log(`Deleted branch: ${branch}`);
            } else {
              console.log(`Skipped protected branch: ${branch}`);
            }